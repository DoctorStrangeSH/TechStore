<!-- ТОПБАР -->
<header class="topbar bg-white border-bottom px-3 px-md-4 py-2 d-flex align-items-center gap-3">
    
    <!-- Кнопка сворачивания сайдбара -->
    <button class="btn btn-outline-secondary btn-sm d-flex align-items-center" id="sidebarToggle" title="Свернуть меню">
        <i class="bi bi-list fs-5"></i>
    </button>
    
    <!-- Хлебные крошки (скрываются на мобилке) -->
    <nav aria-label="breadcrumb" class="d-none d-md-block">
        <ol class="breadcrumb mb-0">
            <li class="breadcrumb-item"><a href="#" class="text-decoration-none">Главная</a></li>
            <li class="breadcrumb-item active" aria-current="page">Дашборд</li>
        </ol>
    </nav>
    
    <!-- Поиск -->
    <form class="d-none d-lg-flex ms-auto me-3" role="search">
        <div class="input-group input-group-sm" style="max-width: 280px;">
            <span class="input-group-text bg-white border-end-0 rounded-start-pill">
                <i class="bi bi-search text-muted"></i>
            </span>
            <input class="form-control border-start-0 rounded-end-pill" type="search" 
                   placeholder="Поиск по заказам, товарам..." aria-label="Поиск">
        </div>
    </form>
    
    <!-- Кнопка поиска на мобилке -->
    <button class="btn btn-outline-secondary btn-sm d-lg-none ms-auto" title="Поиск">
        <i class="bi bi-search"></i>
    </button>
    
    <!-- Уведомления -->
    <div class="dropdown">
        <button class="btn btn-outline-secondary btn-sm position-relative" type="button" 
                data-bs-toggle="dropdown" aria-expanded="false" title="Уведомления">
            <i class="bi bi-bell fs-5"></i>
            <span class="position-absolute top-0 start-100 translate-middle p-1 bg-danger border border-light rounded-circle">
                <span class="visually-hidden">Новые уведомления</span>
            </span>
        </button>
        <div class="dropdown-menu dropdown-menu-end shadow-sm p-0" style="width: 320px; max-height: 400px; overflow-y: auto;">
            <div class="px-3 py-2 border-bottom d-flex justify-content-between align-items-center">
                <span class="fw-semibold small">Уведомления</span>
                <span class="badge bg-danger rounded-pill">3 новых</span>
            </div>
            
            <a href="#" class="dropdown-item d-flex gap-2 py-2 border-bottom">
                <div class="flex-shrink-0">
                    <i class="bi bi-cart-check-fill text-success fs-5"></i>
                </div>
                <div class="small">
                    <p class="mb-0 fw-semibold">Заказ #1089 оформлен</p>
                    <p class="mb-0 text-muted">2 минуты назад</p>
                </div>
            </a>
            
            <a href="#" class="dropdown-item d-flex gap-2 py-2 border-bottom">
                <div class="flex-shrink-0">
                    <i class="bi bi-exclamation-triangle-fill text-warning fs-5"></i>
                </div>
                <div class="small">
                    <p class="mb-0 fw-semibold">Низкий остаток: iPhone 15</p>
                    <p class="mb-0 text-muted">1 час назад</p>
                </div>
            </a>
            
            <a href="#" class="dropdown-item d-flex gap-2 py-2">
                <div class="flex-shrink-0">
                    <i class="bi bi-star-fill text-primary fs-5"></i>
                </div>
                <div class="small">
                    <p class="mb-0 fw-semibold">Новый отзыв 5★</p>
                    <p class="mb-0 text-muted">3 часа назад</p>
                </div>
            </a>
            
            <div class="px-3 py-2 border-top text-center">
                <a href="#" class="small text-decoration-none">Все уведомления →</a>
            </div>
        </div>
    </div>
    
    <!-- Профиль -->
    <div class="dropdown">
        <button class="btn btn-light btn-sm d-flex align-items-center gap-2 dropdown-toggle" type="button" 
                data-bs-toggle="dropdown" aria-expanded="false">
            <img src="https://placehold.co/32x32/0d6efd/white?text=АД" 
                 alt="Алексей" class="rounded-circle" width="32" height="32">
            <span class="d-none d-md-inline small fw-semibold">Алексей</span>
        </button>
        <ul class="dropdown-menu dropdown-menu-end shadow-sm">
            <li><a class="dropdown-item" href="#"><i class="bi bi-person me-2"></i>Профиль</a></li>
            <li><a class="dropdown-item" href="#"><i class="bi bi-gear me-2"></i>Настройки</a></li>
            <li><hr class="dropdown-divider"></li>
            <li><a class="dropdown-item text-danger" href="#"><i class="bi bi-box-arrow-right me-2"></i>Выйти</a></li>
        </ul>
    </div>
    
</header>
