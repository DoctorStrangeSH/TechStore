<!-- ТАБЛИЦА ЗАКАЗОВ -->
<div class="card border-0 shadow-sm">
    
    <!-- Заголовок таблицы -->
    <div class="card-header bg-white border-bottom d-flex flex-column flex-md-row justify-content-between align-items-start align-items-md-center p-3 p-md-4">
        <h5 class="fw-bold mb-2 mb-md-0">
            <i class="bi bi-cart-check me-2 text-primary"></i>Последние заказы
        </h5>
        <div class="d-flex gap-2">
            <!-- Фильтр по статусу -->
            <select class="form-select form-select-sm" style="width: auto;" id="statusFilter">
                <option value="all">Все статусы</option>
                <option value="pending">Ожидает</option>
                <option value="processing">В обработке</option>
                <option value="shipped">В пути</option>
                <option value="delivered">Доставлен</option>
                <option value="cancelled">Отменён</option>
            </select>
            <!-- Кнопка «Все заказы» -->
            <a href="#" class="btn btn-outline-primary btn-sm rounded-pill px-3">
                Все заказы <i class="bi bi-arrow-right"></i>
            </a>
        </div>
    </div>
    
    <!-- Таблица -->
    <div class="table-responsive">
        <table class="table table-hover align-middle mb-0">
            <thead class="table-light">
                <tr>
                    <th scope="col" class="ps-4">Заказ</th>
                    <th scope="col">Клиент</th>
                    <th scope="col" class="d-none d-md-table-cell">Дата</th>
                    <th scope="col">Сумма</th>
                    <th scope="col">Статус</th>
                    <th scope="col" class="text-end pe-4">Действия</th>
                </tr>
            </thead>
            <tbody id="orders-table-body">
                <!-- Рендерится из js/main.js -->
            </tbody>
        </table>
    </div>
    
    <!-- Пагинация -->
    <div class="card-footer bg-white border-top d-flex justify-content-between align-items-center p-3">
        <small class="text-muted" id="orders-info">Показано 1–5 из 10</small>
        <nav>
            <ul class="pagination pagination-sm mb-0" id="orders-pagination">
                <!-- Рендерится из js/main.js -->
            </ul>
        </nav>
    </div>
    
</div>
