<!-- ГРАФИК ПРОДАЖ -->
<div class="card border-0 shadow-sm h-100">
    <div class="card-header bg-white border-bottom d-flex justify-content-between align-items-center p-3 p-md-4">
        <h5 class="fw-bold mb-0">
            <i class="bi bi-graph-up me-2 text-success"></i>Продажи
        </h5>
        <div class="btn-group btn-group-sm" role="group" id="chart-tabs">
            <button type="button" class="btn btn-outline-primary active" data-period="week">Неделя</button>
            <button type="button" class="btn btn-outline-primary" data-period="month">Месяц</button>
        </div>
    </div>
    <div class="card-body p-3 p-md-4 d-flex align-items-center">
        <canvas id="salesChart" width="100%" height="280"></canvas>
    </div>
</div>
